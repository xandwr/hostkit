[package]
name = "hostkit"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.177"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.dev]
incremental = false

[profile.test]
incremental = false
